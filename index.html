<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="What to Eat" />
  <meta name="theme-color" content="#e85d04" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>What to Eat Today?</title>
  <style>
    :root {
      --bg: #f7f3ef; --card: #ffffff; --primary: #e85d04;
      --text: #1f1f1f; --muted: #6b6b6b; --border: #ebe4dc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #f7f3ef 0%, #f0e9e1 100%);
      color: var(--text); min-height: 100vh; min-height: 100dvh;
      padding: 20px 16px 50px;
      padding-top: max(20px, env(safe-area-inset-top));
      padding-bottom: max(50px, env(safe-area-inset-bottom));
      line-height: 1.5;
    }
    .container { max-width: 420px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 24px; }
    header h1 {
      font-size: 1.85rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px;
      background: linear-gradient(135deg, #e85d04, #d00000);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    header p { color: var(--muted); font-size: 0.95rem; }
    .card {
      background: var(--card); border-radius: 18px; padding: 18px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.05); margin-bottom: 14px;
      border: 1px solid var(--border);
    }
    .section-title {
      font-size: 0.78rem; font-weight: 700; color: var(--muted);
      margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .distance-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
    .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip, .distance-btn {
      border: 1.5px solid var(--border); background: #fff; border-radius: 999px;
      padding: 8px 14px; font-size: 0.88rem; font-weight: 500; cursor: pointer;
      color: var(--text); transition: all 0.15s ease; -webkit-tap-highlight-color: transparent;
    }
    .distance-btn { border-radius: 12px; padding: 11px 0; text-align: center; }
    .chip.active, .distance-btn.active {
      background: var(--primary); border-color: var(--primary); color: white;
      box-shadow: 0 4px 12px rgba(232, 93, 4, 0.25);
    }
    .slider-area { margin-top: 4px; }
    .slider-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .slider-label { font-size: 0.88rem; color: var(--muted); }
    .current-distance { font-size: 1.15rem; font-weight: 700; color: var(--primary); }
    input[type="range"] {
      -webkit-appearance: none; width: 100%; height: 6px;
      background: #e8e0d6; border-radius: 3px; outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 22px; height: 22px;
      background: var(--primary); border-radius: 50%; cursor: pointer;
      border: 3px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .slider-marks { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); margin-top: 6px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; width: 100%;
      padding: 15px 20px; border: none; border-radius: 14px; font-size: 1.08rem;
      font-weight: 700; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .btn-primary {
      background: linear-gradient(135deg, #e85d04, #d00000); color: white;
      box-shadow: 0 6px 18px rgba(232, 93, 4, 0.3);
    }
    .btn-primary:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }
    .btn-secondary { background: #f3ede6; color: var(--text); margin-top: 10px; }
    .result {
      display: none; animation: fadeInUp 0.4s ease;
      border: 2px solid #ffe0c2; background: linear-gradient(180deg, #fffdf9 0%, #fff 100%);
    }
    .result.show { display: block; }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .restaurant-name { font-size: 1.35rem; font-weight: 800; margin-bottom: 10px; line-height: 1.3; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; font-size: 0.9rem; color: var(--muted); }
    .meta span { background: #f7f1ea; padding: 4px 10px; border-radius: 20px; font-weight: 500; }
    .address { font-size: 0.92rem; color: var(--muted); margin-bottom: 16px; }
    .maps-btn {
      display: inline-flex; align-items: center; gap: 6px; background: #4285f4;
      color: white; text-decoration: none; padding: 11px 18px; border-radius: 12px;
      font-size: 0.95rem; font-weight: 600;
    }
    .status {
      text-align: center; padding: 12px; border-radius: 12px; font-size: 0.9rem;
      margin-bottom: 12px; display: none;
    }
    .status.show { display: block; }
    .status.loading { background: #fff3e0; color: #e65100; }
    .status.error { background: #fce8e6; color: #c5221f; }
    footer { text-align: center; margin-top: 20px; font-size: 0.8rem; color: var(--muted); }
    #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>
  <div class="container">
    <header>
      <h1>What to Eat Today?</h1>
      <p>Real-time nearby restaurants</p>
    </header>

    <div class="card">
      <div class="section-title">Distance Range</div>
      <div class="distance-grid">
        <button class="distance-btn" data-miles="1">1 mi</button>
        <button class="distance-btn active" data-miles="2">2 mi</button>
        <button class="distance-btn" data-miles="5">5 mi</button>
        <button class="distance-btn" data-miles="8">8 mi</button>
      </div>
      <div class="slider-area">
        <div class="slider-header">
          <span class="slider-label">Custom</span>
          <span class="current-distance" id="distance-display">2.0 mi</span>
        </div>
        <input type="range" id="distance-slider" min="0.5" max="12" step="0.5" value="2" />
        <div class="slider-marks"><span>0.5</span><span>4</span><span>8</span><span>12</span></div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Meal Style</div>
      <div class="chip-grid" id="style-filters">
        <button class="chip active" data-style="any">Any</button>
        <button class="chip" data-style="fast">Fast Food</button>
        <button class="chip" data-style="sitdown">Sit-down only</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Cuisine</div>
      <div class="chip-grid" id="cuisine-filters">
        <button class="chip active" data-cuisine="any">Any</button>
        <button class="chip" data-cuisine="chinese">Chinese</button>
        <button class="chip" data-cuisine="japanese">Japanese</button>
        <button class="chip" data-cuisine="italian">Italian</button>
        <button class="chip" data-cuisine="mexican">Mexican</button>
        <button class="chip" data-cuisine="indian">Indian</button>
        <button class="chip" data-cuisine="thai">Thai / Vietnamese</button>
        <button class="chip" data-cuisine="american">American</button>
        <button class="chip" data-cuisine="cafe">Cafe</button>
      </div>
    </div>

    <button class="btn btn-primary" id="main-btn" onclick="startRandom()">
      🎲 Pick a Restaurant
    </button>

    <div id="status" class="status"></div>

    <div id="result" class="card result">
      <div class="restaurant-name" id="res-name"></div>
      <div class="meta">
        <span id="res-distance"></span>
        <span id="res-cuisine"></span>
        <span id="res-style"></span>
      </div>
      <div class="address" id="res-address"></div>
      <a id="res-maps" class="maps-btn" href="#" target="_blank" rel="noopener">📍 Open in Google Maps</a>
      <button class="btn btn-secondary" style="margin-top:14px;" onclick="startRandom()">Pick Another One</button>
    </div>

    <footer>Live data via OpenStreetMap · Works worldwide</footer>
  </div>

  <script>
    // ========== 改成你的 Worker 地址 ==========
    const PROXY_URL = 'https://resturant.jl2040550.workers.dev';
    // ========================================

    let selectedMiles = 2;
    let selectedStyle = 'any';
    let selectedCuisine = 'any';

    const slider = document.getElementById('distance-slider');
    const distanceDisplay = document.getElementById('distance-display');

    document.querySelectorAll('.distance-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.distance-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedMiles = parseFloat(btn.dataset.miles);
        slider.value = selectedMiles;
        updateDistanceDisplay();
      });
    });

    slider.addEventListener('input', () => {
      selectedMiles = parseFloat(slider.value);
      updateDistanceDisplay();
      document.querySelectorAll('.distance-btn').forEach(b => b.classList.remove('active'));
    });

    function updateDistanceDisplay() {
      distanceDisplay.textContent = selectedMiles.toFixed(1) + ' mi';
    }

    document.querySelectorAll('#style-filters .chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#style-filters .chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedStyle = btn.dataset.style;
      });
    });

    document.querySelectorAll('#cuisine-filters .chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#cuisine-filters .chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedCuisine = btn.dataset.cuisine;
      });
    });

    function showStatus(msg, type = 'loading') {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = `status show ${type}`;
    }
    function hideStatus() {
      document.getElementById('status').className = 'status';
    }

    function getLocation() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) return reject(new Error('Geolocation not supported'));
        navigator.geolocation.getCurrentPosition(
          pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
          err => reject(err),
          { enableHighAccuracy: true, timeout: 12000 }
        );
      });
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 3958.8;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function detectCuisine(tags) {
      const c = (tags.cuisine || '').toLowerCase();
      const name = (tags.name || '').toLowerCase();
      if (c.includes('chinese') || c.includes('sichuan') || name.includes('china') || name.includes('wok') || name.includes('dumpling') || name.includes('hot pot') || name.includes('szechuan')) return 'chinese';
      if (c.includes('japanese') || c.includes('sushi') || c.includes('ramen') || name.includes('sushi') || name.includes('ramen')) return 'japanese';
      if (c.includes('italian') || c.includes('pizza') || name.includes('pizza')) return 'italian';
      if (c.includes('mexican') || c.includes('taco') || name.includes('taco') || name.includes('burrito')) return 'mexican';
      if (c.includes('indian') || name.includes('india') || name.includes('curry') || name.includes('tandoor')) return 'indian';
      if (c.includes('thai') || c.includes('vietnamese') || name.includes('thai') || name.includes('pho') || name.includes('vietnam')) return 'thai';
      if (tags.amenity === 'cafe' || c.includes('coffee') || name.includes('starbucks') || name.includes('dunkin')) return 'cafe';
      if (c.includes('american') || c.includes('burger') || name.includes('burger') || name.includes('grill')) return 'american';
      return 'other';
    }

    function detectStyle(tags) {
      if (tags.amenity === 'fast_food' || tags.amenity === 'cafe') return 'fast';
      const name = (tags.name || '').toLowerCase();
      if (name.includes('mcdonald') || name.includes('burger king') || name.includes('wendy') || name.includes('taco bell') || name.includes('kfc') || name.includes('subway') || name.includes('chipotle') || name.includes('panda') || name.includes('five guys')) return 'fast';
      return 'sitdown';
    }

    async function fetchRealRestaurants(lat, lng, miles) {
      const radius = Math.round(miles * 1609.34);
      const url = `${PROXY_URL}?lat=${lat}&lng=${lng}&radius=${radius}`;

      const res = await fetch(url);
      if (!res.ok) throw new Error('Proxy request failed');
      const data = await res.json();

      if (data.error) throw new Error(data.error);

      return (data.elements || []).map(el => {
        if (!el.lat || !el.lon) return null;
        const tags = el.tags || {};
        const name = tags.name || tags['name:en'];
        if (!name) return null;
        return {
          name,
          lat: el.lat,
          lng: el.lon,
          cuisine: detectCuisine(tags),
          style: detectStyle(tags),
          address: [tags['addr:housenumber'], tags['addr:street'], tags['addr:city']].filter(Boolean).join(' ') || ''
        };
      }).filter(Boolean);
    }

    function matchesFilters(r) {
      if (selectedStyle === 'fast' && r.style !== 'fast') return false;
      if (selectedStyle === 'sitdown' && r.style !== 'sitdown') return false;
      if (selectedCuisine !== 'any' && r.cuisine !== selectedCuisine) return false;
      return true;
    }

    function launchConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const colors = ['#e85d04', '#d00000', '#ffbe0b', '#3a86ff', '#8338ec', '#fb5607'];
      const particles = [];
      for (let i = 0; i < 100; i++) {
        particles.push({
          x: canvas.width/2, y: canvas.height/3,
          vx: (Math.random()-0.5)*12, vy: Math.random()*-10-3,
          size: Math.random()*6+3, color: colors[Math.floor(Math.random()*colors.length)],
          life: 80+Math.random()*40, gravity: 0.15+Math.random()*0.08
        });
      }
      function animate() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        let alive = false;
        particles.forEach(p => {
          if (p.life <= 0) return;
          alive = true;
          p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.life--; p.size *= 0.985;
          ctx.globalAlpha = Math.max(0, p.life/80);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(0, p.size), 0, Math.PI*2);
          ctx.fill();
        });
        if (alive) requestAnimationFrame(animate);
        else ctx.clearRect(0,0,canvas.width,canvas.height);
      }
      animate();
    }

    async function startRandom() {
      const btn = document.getElementById('main-btn');
      btn.disabled = true;
      document.getElementById('result').classList.remove('show');
      hideStatus();

      try {
        showStatus('Getting your location…', 'loading');
        const pos = await getLocation();

        showStatus('Searching live restaurants…', 'loading');
        let restaurants = await fetchRealRestaurants(pos.lat, pos.lng, selectedMiles);

        restaurants = restaurants
          .map(r => ({ ...r, distance: getDistance(pos.lat, pos.lng, r.lat, r.lng) }))
          .filter(r => r.distance <= selectedMiles)
          .filter(matchesFilters);

        if (restaurants.length === 0) {
          showStatus('No restaurants match your filters. Try larger distance or different options.', 'error');
          btn.disabled = false;
          return;
        }

        restaurants.sort((a, b) => a.distance - b.distance);
        const pool = restaurants.slice(0, Math.min(20, restaurants.length));
        const chosen = pool[Math.floor(Math.random() * pool.length)];

        displayResult(chosen);
        launchConfetti();
      } catch (err) {
        console.error(err);
        if (err.code === 1) {
          showStatus('Location permission denied. Please allow location access.', 'error');
        } else {
          showStatus('Search failed. Check your Worker URL or try again later.', 'error');
        }
      } finally {
        btn.disabled = false;
      }
    }

    function displayResult(r) {
      hideStatus();
      document.getElementById('res-name').textContent = r.name;
      document.getElementById('res-distance').textContent = `~${r.distance.toFixed(1)} mi`;
      document.getElementById('res-cuisine').textContent = r.cuisine === 'other' ? '' : (r.cuisine.charAt(0).toUpperCase() + r.cuisine.slice(1));
      document.getElementById('res-style').textContent = r.style === 'fast' ? 'Fast Food' : 'Sit-down';
      document.getElementById('res-address').textContent = r.address || 'Address not available';
      document.getElementById('res-maps').href = `https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lng}`;
      document.getElementById('result').classList.add('show');
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
